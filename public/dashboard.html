<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commento</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .btn { @apply inline-flex h-9 items-center justify-center gap-2 rounded-md px-3 text-sm font-medium transition-colors disabled:pointer-events-none disabled:opacity-50; }
      .btn-primary { @apply btn bg-zinc-900 text-white shadow-sm hover:bg-zinc-800; }
      .btn-outline { @apply btn border border-zinc-200 bg-white shadow-sm hover:bg-zinc-100; }
      .btn-icon { @apply btn w-9 px-0 text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900; }
      .input { @apply h-9 w-full min-w-0 rounded-md border border-zinc-200 bg-white px-3 text-sm shadow-sm placeholder:text-zinc-400 focus-visible:border-zinc-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-900/10; }
      .card { @apply rounded-xl border border-zinc-200 bg-white shadow-sm; }
      .tab { @apply rounded-md px-3 py-1 font-medium text-zinc-500 transition-colors hover:text-zinc-900; }
      .tab-active { @apply bg-white text-zinc-900 shadow-sm; }
    }
  </style>
  <style>
    .comment-card { transition: all 0.3s ease; }
    .comment-card.replied { opacity: 0.5; transform: scale(0.98); }
    .comment-card.hidden { display: none; }
    .comment-card.sending { opacity: 0.6; }
    .sending-badge { animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-10 border-b border-zinc-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex h-14 max-w-3xl items-center gap-2 px-4">
      <a href="/" class="flex items-center gap-2 font-semibold tracking-tight">
        <span class="grid h-7 w-7 place-items-center rounded-md bg-zinc-900 text-sm text-white">💬</span>
        <span class="hidden sm:inline">Commento</span>
      </a>
      <span id="count" class="rounded-full bg-zinc-100 px-2 py-0.5 text-xs font-medium text-zinc-600 empty:hidden"></span>
      <nav class="ml-auto inline-flex items-center rounded-lg bg-zinc-100 p-1 text-sm">
        <a href="/" onclick="localStorage.setItem('commento_view','inbox')" class="tab tab-active">Inbox</a>
        <a href="/picker.html" onclick="localStorage.setItem('commento_view','picker')" class="tab">Picker</a>
      </nav>
      <button onclick="refresh()" class="btn-icon" title="Refresh">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
      </button>
      <a href="/logout" class="btn-icon" title="Logout">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="mx-auto max-w-3xl p-4 sm:p-6">
    <div class="mb-3 flex items-center justify-between gap-2">
      <div class="inline-flex items-center rounded-lg bg-zinc-100 p-1 text-xs">
        <button onclick="setSort('newest')" id="sort-newest" class="tab">Newest</button>
        <button onclick="setSort('oldest')" id="sort-oldest" class="tab">Oldest</button>
      </div>
      <button onclick="clearDismissed()" id="clear-btn" class="hidden text-xs text-zinc-500 hover:text-zinc-900" title="Show dismissed">
        <span id="dismissed-count"></span> hidden · show again
      </button>
    </div>

    <div id="loading" class="py-12 text-center text-sm text-zinc-500">
      Loading posts...
    </div>

    <div id="empty" class="card hidden px-6 py-12 text-center">
      <div class="mx-auto mb-3 grid h-10 w-10 place-items-center rounded-full bg-zinc-100 text-zinc-900">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <p class="font-medium">All caught up</p>
      <p class="mt-1 text-sm text-zinc-500">No unanswered comments.</p>
    </div>

    <div id="comments" class="space-y-3"></div>

    <div id="load-more" class="hidden py-6 text-center">
      <button onclick="loadMorePosts()" id="load-more-btn" class="btn-outline">
        Load older posts...
      </button>
    </div>

    <footer class="py-8 text-center text-xs text-zinc-400">
      by <a href="https://yannickpulver.dev" target="_blank" class="transition-colors hover:text-zinc-600">yannickpulver</a>
    </footer>
  </main>

  <script>
    // Auto-switch to picker if user previously chose it
    if (localStorage.getItem('commento_view') === 'picker') {
      window.location.replace('/picker.html');
    }

    let nextCursor = null;
    let totalCount = 0;
    let isLoading = false;
    let initialLoadDone = false;
    
    // Persistent storage for dismissed comments
    const STORAGE_KEY = 'commento_dismissed';
    
    function getDismissed() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }
    
    function saveDismissed(ids) {
      const trimmed = ids.slice(-1000);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
    }
    
    function isDismissed(commentId) {
      return getDismissed().includes(commentId);
    }
    
    function addDismissed(commentId) {
      const dismissed = getDismissed();
      if (!dismissed.includes(commentId)) {
        dismissed.push(commentId);
        saveDismissed(dismissed);
        updateDismissedUI();
      }
    }
    
    function clearDismissed() {
      if (confirm('Show all dismissed comments again?')) {
        localStorage.removeItem(STORAGE_KEY);
        refresh();
      }
    }
    
    function updateDismissedUI() {
      const count = getDismissed().length;
      const btn = document.getElementById('clear-btn');
      const countEl = document.getElementById('dismissed-count');
      if (count > 0) {
        btn.classList.remove('hidden');
        countEl.textContent = count;
      } else {
        btn.classList.add('hidden');
      }
    }
    
    function showLoading(text) {
      const loading = document.getElementById('loading');
      loading.textContent = text;
      loading.classList.remove('hidden');
    }
    
    function hideLoading() {
      document.getElementById('loading').classList.add('hidden');
    }
    
    async function loadPosts(cursor = null, autoLoad = true) {
      if (isLoading) return;
      isLoading = true;
      
      const container = document.getElementById('comments');
      const loadMoreDiv = document.getElementById('load-more');
      
      // Only show loading on initial load, not when scrolling back
      if (!initialLoadDone) {
        showLoading('Loading posts...');
      } else if (cursor) {
        document.getElementById('load-more-btn').textContent = 'Loading...';
      }
      
      let foundAny = false;
      
      try {
        const url = cursor ? `/api/media?cursor=${cursor}` : '/api/media';
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.error) {
          showLoading(`Error: ${data.error}`);
          isLoading = false;
          return;
        }
        
        nextCursor = data.nextCursor;
        
        for (let i = 0; i < data.posts.length; i++) {
          const post = data.posts[i];
          
          // Show progress only on initial load when nothing found yet
          if (!initialLoadDone && totalCount === 0) {
            const caption = post.caption ? post.caption.substring(0, 30) + '...' : 'Post';
            showLoading(`Checking post ${i + 1}/${data.posts.length}: "${caption}"`);
          }
          
          const { me, threads } = await loadThreadsForPost(post);
          if (threads.length > 0) {
            for (const thread of threads) {
              if (isDismissed(thread.last.id)) continue;
              
              totalCount++;
              foundAny = true;
              const card = createThreadCard(thread, post, me);
              insertSorted(card);
            }
            updateCount();
            
            // Hide loading as soon as we have content
            if (totalCount > 0) {
              hideLoading();
            }
          }
        }
        
        hideLoading();
        initialLoadDone = true;
        
        if (nextCursor) {
          loadMoreDiv.classList.remove('hidden');
          document.getElementById('load-more-btn').textContent = 'Load older posts...';
        } else {
          loadMoreDiv.classList.add('hidden');
        }
        
        // Auto-load more if nothing found yet and there are more posts
        if (!foundAny && totalCount === 0 && nextCursor && autoLoad) {
          showLoading('No comments found, loading older posts...');
          isLoading = false;
          await loadPosts(nextCursor, true);
          return;
        }
        
        if (totalCount === 0 && !nextCursor) {
          document.getElementById('empty').classList.remove('hidden');
        }
        
      } catch (err) {
        showLoading(`Error: ${err.message}`);
      }
      
      isLoading = false;
    }
    
    async function loadThreadsForPost(post) {
      try {
        const res = await fetch(`/api/comments/${post.id}`);
        const data = await res.json();
        return { me: data.me, threads: data.threads || [] };
      } catch (err) {
        console.error('Failed to load comments for post', post.id, err);
        return { threads: [] };
      }
    }
    
    function loadMorePosts() {
      if (nextCursor) {
        loadPosts(nextCursor, false);
      }
    }
    
    // Sort by the last message of a thread: how long someone has been waiting
    let sortOrder = localStorage.getItem('commento_sort') || 'newest';

    function comesBefore(a, b) {
      return sortOrder === 'oldest' ? a.dataset.ts < b.dataset.ts : a.dataset.ts > b.dataset.ts;
    }

    function insertSorted(card) {
      const container = document.getElementById('comments');
      const next = [...container.children].find(other => comesBefore(card, other));
      container.insertBefore(card, next || null);
    }

    function setSort(order) {
      sortOrder = order;
      localStorage.setItem('commento_sort', order);
      for (const o of ['newest', 'oldest']) {
        document.getElementById(`sort-${o}`).classList.toggle('tab-active', o === order);
      }
      const container = document.getElementById('comments');
      const cards = [...container.children];
      container.innerHTML = '';
      cards.forEach(insertSorted);
    }

    function refresh() {
      document.getElementById('comments').innerHTML = '';
      document.getElementById('empty').classList.add('hidden');
      totalCount = 0;
      nextCursor = null;
      initialLoadDone = false;
      updateCount();
      loadPosts();
    }
    
    function updateCount() {
      const countEl = document.getElementById('count');
      countEl.textContent = totalCount > 0 ? `${totalCount}` : '';
    }
    
    function getInitials(username) {
      return (username || '?').substring(0, 2).toUpperCase();
    }
    
    function formatDate(timestamp) {
      return new Date(timestamp).toLocaleDateString('en-US', {
        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
      });
    }

    function createReplyRow(reply, me) {
      const mine = reply.username === me;
      return `
        <div class="mt-3 border-l-2 border-zinc-200 pl-3">
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-xs font-medium ${mine ? 'text-zinc-500' : ''}">@${escapeHtml(reply.username)}</span>
            ${mine ? '<span class="rounded bg-zinc-100 px-1.5 py-0.5 text-[10px] font-medium text-zinc-500">You</span>' : ''}
            <span class="text-xs text-zinc-400">${formatDate(reply.timestamp)}</span>
          </div>
          <p class="mt-0.5 break-words text-sm ${mine ? 'text-zinc-500' : 'text-zinc-700'}">${escapeHtml(reply.text)}</p>
        </div>
      `;
    }

    function createThreadCard(thread, post, me) {
      const comment = thread.root;
      // Reply goes to the top-level comment and mentions whoever wrote last
      const mention = thread.last.username;
      const card = document.createElement('div');
      card.className = 'comment-card card p-4';
      card.id = `comment-${thread.id}`;
      card.dataset.last = thread.last.id;
      card.dataset.ts = thread.last.timestamp;

      const date = formatDate(comment.timestamp);
      const thumbnail = post.thumbnail_url || post.media_url;
      const avatarUrl = `/api/avatar/${comment.username}`;
      const initials = getInitials(comment.username);

      card.innerHTML = `
        <div class="flex gap-3">
          <!-- Post Thumbnail -->
          <a href="${post.permalink}" target="_blank" class="flex-shrink-0">
            <img src="${thumbnail}" alt="" class="h-12 w-12 rounded-md border border-zinc-200 object-cover sm:h-14 sm:w-14" loading="lazy">
          </a>

          <!-- Content -->
          <div class="min-w-0 flex-1">
            <!-- Header with avatar -->
            <div class="mb-1 flex items-center gap-2">
              <div class="relative h-6 w-6 flex-shrink-0">
                <div class="flex h-6 w-6 items-center justify-center rounded-full bg-zinc-100 text-[10px] font-medium">
                  ${initials}
                </div>
                <img
                  src="${avatarUrl}"
                  alt=""
                  class="absolute inset-0 h-6 w-6 rounded-full object-cover"
                  onerror="this.style.display='none'"
                  loading="lazy"
                >
              </div>
              <div class="flex min-w-0 flex-1 flex-wrap items-center gap-x-2">
                <span class="truncate text-sm font-medium">@${comment.username}</span>
                <span class="text-xs text-zinc-400">${date}</span>
              </div>
              <button
                onclick="markDone('${thread.id}')"
                class="btn-icon -my-1 -mr-2 h-8 w-8"
                title="Dismiss"
              >
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>

            <!-- Comment Text -->
            <p class="break-words text-sm text-zinc-700">${escapeHtml(comment.text)}</p>
            ${thread.replies.map(r => createReplyRow(r, me)).join('')}

            <!-- Reply Input -->
            <div class="mt-4 flex gap-2">
              <input
                type="text"
                id="reply-${thread.id}"
                placeholder="Reply to @${escapeHtml(mention)}..."
                class="input"
                onkeydown="if(event.key==='Enter') sendReply('${thread.id}', '${mention}')"
              >
              <button
                onclick="sendReply('${thread.id}', '${mention}')"
                class="btn-primary flex-shrink-0"
              >
                <span class="hidden sm:inline">Send</span>
                <svg class="h-4 w-4 sm:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
              </button>
            </div>

            <!-- Sending indicator -->
            <div id="sending-${thread.id}" class="sending-badge mt-2 hidden text-xs text-zinc-500">
              Sending...
            </div>
          </div>
        </div>
      `;

      return card;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    async function sendReply(commentId, username) {
      const input = document.getElementById(`reply-${commentId}`);
      const card = document.getElementById(`comment-${commentId}`);
      const sendingBadge = document.getElementById(`sending-${commentId}`);
      let message = input.value.trim();
      
      if (!message) return;
      
      if (!message.startsWith('@')) {
        message = `@${username} ${message}`;
      }
      
      input.disabled = true;
      card.classList.add('sending');
      sendingBadge.classList.remove('hidden');
      
      focusNextInput(card);
      
      try {
        const res = await fetch('/api/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comment_id: commentId, message })
        });
        
        const data = await res.json();
        
        if (data.success) {
          markDone(commentId);
        } else {
          card.classList.remove('sending');
          sendingBadge.classList.add('hidden');
          input.disabled = false;
          input.focus();
          alert('Error: ' + (data.error?.message || JSON.stringify(data.error) || 'Unknown'));
        }
      } catch (err) {
        card.classList.remove('sending');
        sendingBadge.classList.add('hidden');
        input.disabled = false;
        input.focus();
        alert('Error: ' + err.message);
      }
    }
    
    function focusNextInput(currentCard) {
      let sibling = currentCard.nextElementSibling;
      while (sibling) {
        if (sibling.classList.contains('comment-card') && !sibling.classList.contains('hidden') && !sibling.classList.contains('sending')) {
          const nextInput = sibling.querySelector('input[type="text"]');
          if (nextInput) {
            nextInput.focus();
            return;
          }
        }
        sibling = sibling.nextElementSibling;
      }
    }
    
    function markDone(commentId) {
      const card = document.getElementById(`comment-${commentId}`);
      if (card) {
        addDismissed(card.dataset.last);
        
        card.classList.remove('sending');
        card.classList.add('replied');
        setTimeout(() => {
          card.classList.add('hidden');
          totalCount--;
          updateCount();
          
          if (totalCount === 0 && !nextCursor) {
            document.getElementById('empty').classList.remove('hidden');
          }
        }, 300);
      }
    }
    
    // Start loading
    updateDismissedUI();
    setSort(sortOrder);
    loadPosts();
  </script>
</body>
</html>
