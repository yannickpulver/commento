<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .comment-card { transition: all 0.3s ease; }
    .comment-card.replied { opacity: 0.5; transform: scale(0.98); }
    .comment-card.hidden { display: none; }
    .comment-card.sending { opacity: 0.6; }
    .sending-badge { animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body class="bg-neutral-950 text-white min-h-screen">
  
  <!-- Header -->
  <header class="border-b border-white/10 px-4 py-3 flex items-center justify-between sticky top-0 bg-neutral-950/95 backdrop-blur-sm z-10">
    <div class="flex items-center gap-2 sm:gap-4">
      <h1 class="text-lg sm:text-xl font-medium">📸 Commento</h1>
      <span id="count" class="text-xs sm:text-sm text-neutral-500"></span>
    </div>
    <div class="flex items-center gap-2 sm:gap-4">
      <button onclick="refresh()" class="p-2 text-neutral-400 hover:text-white" title="Refresh">
        🔄
      </button>
      <button onclick="clearDismissed()" id="clear-btn" class="text-xs text-neutral-500 hover:text-white hidden" title="Show dismissed">
        <span id="dismissed-count"></span> hidden
      </button>
      <a href="/logout" class="text-xs sm:text-sm text-neutral-400 hover:text-white">Logout</a>
    </div>
  </header>
  
  <!-- Main Content -->
  <main class="max-w-3xl mx-auto p-3 sm:p-6">
    <div id="loading" class="text-center py-8 text-neutral-500">
      Loading posts...
    </div>
    
    <div id="empty" class="text-center py-12 text-neutral-400 hidden">
      ✅ No unanswered comments!
    </div>
    
    <div id="comments" class="space-y-3"></div>
    
    <div id="load-more" class="text-center py-6 hidden">
      <button onclick="loadMorePosts()" id="load-more-btn" class="px-5 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm transition-colors">
        Load older posts...
      </button>
    </div>
  </main>

  <script>
    let nextCursor = null;
    let totalCount = 0;
    let isLoading = false;
    let initialLoadDone = false;
    
    // Persistent storage for dismissed comments
    const STORAGE_KEY = 'commento_dismissed';
    
    function getDismissed() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }
    
    function saveDismissed(ids) {
      const trimmed = ids.slice(-1000);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(trimmed));
    }
    
    function isDismissed(commentId) {
      return getDismissed().includes(commentId);
    }
    
    function addDismissed(commentId) {
      const dismissed = getDismissed();
      if (!dismissed.includes(commentId)) {
        dismissed.push(commentId);
        saveDismissed(dismissed);
        updateDismissedUI();
      }
    }
    
    function clearDismissed() {
      if (confirm('Show all dismissed comments again?')) {
        localStorage.removeItem(STORAGE_KEY);
        refresh();
      }
    }
    
    function updateDismissedUI() {
      const count = getDismissed().length;
      const btn = document.getElementById('clear-btn');
      const countEl = document.getElementById('dismissed-count');
      if (count > 0) {
        btn.classList.remove('hidden');
        countEl.textContent = count;
      } else {
        btn.classList.add('hidden');
      }
    }
    
    function showLoading(text) {
      const loading = document.getElementById('loading');
      loading.textContent = text;
      loading.classList.remove('hidden');
    }
    
    function hideLoading() {
      document.getElementById('loading').classList.add('hidden');
    }
    
    async function loadPosts(cursor = null, autoLoad = true) {
      if (isLoading) return;
      isLoading = true;
      
      const container = document.getElementById('comments');
      const loadMoreDiv = document.getElementById('load-more');
      
      // Only show loading on initial load, not when scrolling back
      if (!initialLoadDone) {
        showLoading('Loading posts...');
      } else if (cursor) {
        document.getElementById('load-more-btn').textContent = 'Loading...';
      }
      
      let foundAny = false;
      
      try {
        const url = cursor ? `/api/media?cursor=${cursor}` : '/api/media';
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.error) {
          showLoading(`Error: ${data.error}`);
          isLoading = false;
          return;
        }
        
        nextCursor = data.nextCursor;
        
        for (let i = 0; i < data.posts.length; i++) {
          const post = data.posts[i];
          
          // Show progress only on initial load when nothing found yet
          if (!initialLoadDone && totalCount === 0) {
            const caption = post.caption ? post.caption.substring(0, 30) + '...' : 'Post';
            showLoading(`Checking post ${i + 1}/${data.posts.length}: "${caption}"`);
          }
          
          const comments = await loadCommentsForPost(post);
          if (comments.length > 0) {
            for (const comment of comments) {
              if (isDismissed(comment.id)) continue;
              
              totalCount++;
              foundAny = true;
              const card = createCommentCard(comment, post);
              container.appendChild(card);
            }
            updateCount();
            
            // Hide loading as soon as we have content
            if (totalCount > 0) {
              hideLoading();
            }
          }
        }
        
        hideLoading();
        initialLoadDone = true;
        
        if (nextCursor) {
          loadMoreDiv.classList.remove('hidden');
          document.getElementById('load-more-btn').textContent = 'Load older posts...';
        } else {
          loadMoreDiv.classList.add('hidden');
        }
        
        // Auto-load more if nothing found yet and there are more posts
        if (!foundAny && totalCount === 0 && nextCursor && autoLoad) {
          showLoading('No comments found, loading older posts...');
          isLoading = false;
          await loadPosts(nextCursor, true);
          return;
        }
        
        if (totalCount === 0 && !nextCursor) {
          document.getElementById('empty').classList.remove('hidden');
        }
        
      } catch (err) {
        showLoading(`Error: ${err.message}`);
      }
      
      isLoading = false;
    }
    
    async function loadCommentsForPost(post) {
      try {
        const res = await fetch(`/api/comments/${post.id}`);
        const data = await res.json();
        return data.comments || [];
      } catch (err) {
        console.error('Failed to load comments for post', post.id, err);
        return [];
      }
    }
    
    function loadMorePosts() {
      if (nextCursor) {
        loadPosts(nextCursor, false);
      }
    }
    
    function refresh() {
      document.getElementById('comments').innerHTML = '';
      document.getElementById('empty').classList.add('hidden');
      totalCount = 0;
      nextCursor = null;
      initialLoadDone = false;
      updateCount();
      loadPosts();
    }
    
    function updateCount() {
      const countEl = document.getElementById('count');
      countEl.textContent = totalCount > 0 ? `${totalCount}` : '';
    }
    
    function getInitials(username) {
      return username.substring(0, 2).toUpperCase();
    }
    
    function createCommentCard(comment, post) {
      const card = document.createElement('div');
      card.className = 'comment-card bg-white/5 border border-white/10 rounded-lg p-3 sm:p-4';
      card.id = `comment-${comment.id}`;
      
      const date = new Date(comment.timestamp).toLocaleDateString('en-US', {
        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
      });
      
      const thumbnail = post.thumbnail_url || post.media_url;
      const avatarUrl = `/api/avatar/${comment.username}`;
      const initials = getInitials(comment.username);
      
      card.innerHTML = `
        <div class="flex gap-3">
          <!-- Post Thumbnail -->
          <a href="${post.permalink}" target="_blank" class="flex-shrink-0">
            <img src="${thumbnail}" alt="" class="w-12 h-12 sm:w-16 sm:h-16 object-cover rounded" loading="lazy">
          </a>
          
          <!-- Content -->
          <div class="flex-1 min-w-0">
            <!-- Header with avatar -->
            <div class="flex items-center gap-2 mb-2">
              <div class="relative w-8 h-8 flex-shrink-0">
                <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-xs font-medium">
                  ${initials}
                </div>
                <img 
                  src="${avatarUrl}" 
                  alt="" 
                  class="absolute inset-0 w-8 h-8 rounded-full object-cover"
                  onerror="this.style.display='none'"
                  loading="lazy"
                >
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-medium text-sm truncate">@${comment.username}</span>
                  <span class="text-neutral-500 text-xs">${date}</span>
                </div>
              </div>
              <a href="${post.permalink}" target="_blank" class="text-neutral-500 hover:text-white text-sm p-1">↗</a>
            </div>
            
            <!-- Comment Text -->
            <p class="text-neutral-300 text-sm mb-3 break-words">${escapeHtml(comment.text)}</p>
            
            <!-- Reply Input -->
            <div class="flex gap-2">
              <input 
                type="text" 
                id="reply-${comment.id}" 
                placeholder="Reply..."
                class="flex-1 min-w-0 bg-white/5 border border-white/10 rounded px-3 py-2 text-sm focus:outline-none focus:border-white/30"
                onkeydown="if(event.key==='Enter') sendReply('${comment.id}', '${comment.username}')"
              >
              <button 
                onclick="sendReply('${comment.id}', '${comment.username}')"
                class="px-3 sm:px-4 py-2 bg-white/10 hover:bg-white/20 rounded text-sm transition-colors flex-shrink-0"
              >
                <span class="hidden sm:inline">Send</span>
                <span class="sm:hidden">↑</span>
              </button>
              <button 
                onclick="markDone('${comment.id}')"
                class="px-2 py-2 text-neutral-500 hover:text-green-400 transition-colors flex-shrink-0"
                title="Mark as done"
              >
                ✓
              </button>
            </div>
            
            <!-- Sending indicator -->
            <div id="sending-${comment.id}" class="sending-badge text-xs text-neutral-500 mt-2 hidden">
              ⏳ Sending...
            </div>
          </div>
        </div>
      `;
      
      return card;
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    async function sendReply(commentId, username) {
      const input = document.getElementById(`reply-${commentId}`);
      const card = document.getElementById(`comment-${commentId}`);
      const sendingBadge = document.getElementById(`sending-${commentId}`);
      let message = input.value.trim();
      
      if (!message) return;
      
      if (!message.startsWith('@')) {
        message = `@${username} ${message}`;
      }
      
      input.disabled = true;
      card.classList.add('sending');
      sendingBadge.classList.remove('hidden');
      
      focusNextInput(card);
      
      try {
        const res = await fetch('/api/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comment_id: commentId, message })
        });
        
        const data = await res.json();
        
        if (data.success) {
          markDone(commentId);
        } else {
          card.classList.remove('sending');
          sendingBadge.classList.add('hidden');
          input.disabled = false;
          input.focus();
          alert('Error: ' + (data.error?.message || JSON.stringify(data.error) || 'Unknown'));
        }
      } catch (err) {
        card.classList.remove('sending');
        sendingBadge.classList.add('hidden');
        input.disabled = false;
        input.focus();
        alert('Error: ' + err.message);
      }
    }
    
    function focusNextInput(currentCard) {
      let sibling = currentCard.nextElementSibling;
      while (sibling) {
        if (sibling.classList.contains('comment-card') && !sibling.classList.contains('hidden') && !sibling.classList.contains('sending')) {
          const nextInput = sibling.querySelector('input[type="text"]');
          if (nextInput) {
            nextInput.focus();
            return;
          }
        }
        sibling = sibling.nextElementSibling;
      }
    }
    
    function markDone(commentId) {
      const card = document.getElementById(`comment-${commentId}`);
      if (card) {
        addDismissed(commentId);
        
        card.classList.remove('sending');
        card.classList.add('replied');
        setTimeout(() => {
          card.classList.add('hidden');
          totalCount--;
          updateCount();
          
          if (totalCount === 0 && !nextCursor) {
            document.getElementById('empty').classList.remove('hidden');
          }
        }, 300);
      }
    }
    
    // Start loading
    updateDismissedUI();
    loadPosts();
  </script>
</body>
</html>
