<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .comment-card { transition: all 0.3s ease; }
    .comment-card.replied { opacity: 0.5; transform: scale(0.98); }
    .comment-card.hidden { display: none; }
    .skeleton { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body class="bg-neutral-950 text-white min-h-screen">
  
  <header class="border-b border-white/10 px-6 py-4 flex items-center justify-between sticky top-0 bg-neutral-950/90 backdrop-blur-sm z-10">
    <div class="flex items-center gap-4">
      <h1 class="text-xl font-medium">📸 Commento</h1>
      <span id="count" class="text-sm text-neutral-500"></span>
    </div>
    <div class="flex items-center gap-4">
      <span id="cache-status" class="text-xs text-neutral-600"></span>
      <button onclick="loadComments(true)" class="text-sm text-neutral-400 hover:text-white flex items-center gap-1">
        <span id="refresh-icon">🔄</span> Refresh
      </button>
      <a href="/logout" class="text-sm text-neutral-400 hover:text-white">Logout</a>
    </div>
  </header>
  
  <main class="max-w-4xl mx-auto p-6">
    <div id="loading" class="space-y-4">
      <div class="skeleton bg-white/5 rounded-lg h-32"></div>
      <div class="skeleton bg-white/5 rounded-lg h-32"></div>
      <div class="skeleton bg-white/5 rounded-lg h-32"></div>
    </div>
    
    <div id="empty" class="text-center py-12 text-neutral-400 hidden">
      ✅ Keine unbeantworteten Kommentare!
    </div>
    
    <div id="comments" class="space-y-4"></div>
    
    <div id="load-more" class="text-center py-8 hidden">
      <button onclick="loadMore()" class="px-6 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm transition-colors">
        Mehr laden...
      </button>
    </div>
  </main>

  <script>
    let currentPage = 0;
    let totalComments = 0;
    let hasMore = false;
    let isLoading = false;
    
    async function loadComments(refresh = false) {
      if (isLoading) return;
      isLoading = true;
      
      const loading = document.getElementById('loading');
      const empty = document.getElementById('empty');
      const container = document.getElementById('comments');
      const loadMoreBtn = document.getElementById('load-more');
      const refreshIcon = document.getElementById('refresh-icon');
      
      if (refresh) {
        currentPage = 0;
        container.innerHTML = '';
        refreshIcon.style.animation = 'spin 1s linear infinite';
      }
      
      loading.classList.remove('hidden');
      empty.classList.add('hidden');
      loadMoreBtn.classList.add('hidden');
      
      try {
        const res = await fetch(`/api/comments?page=${currentPage}&limit=20&refresh=${refresh}`);
        const data = await res.json();
        
        loading.classList.add('hidden');
        refreshIcon.style.animation = '';
        
        if (data.error) {
          container.innerHTML = `<p class="text-red-400">Error: ${data.error}</p>`;
          isLoading = false;
          return;
        }
        
        totalComments = data.total;
        hasMore = data.hasMore;
        
        // Update count
        document.getElementById('count').textContent = `${totalComments} unbeantwortet`;
        
        // Update cache status
        const cacheStatus = document.getElementById('cache-status');
        if (data.cached) {
          cacheStatus.textContent = '(cached)';
        } else {
          cacheStatus.textContent = '';
        }
        
        if (data.comments.length === 0 && currentPage === 0) {
          empty.classList.remove('hidden');
          isLoading = false;
          return;
        }
        
        // Render comments
        for (const comment of data.comments) {
          const card = createCommentCard(comment);
          container.appendChild(card);
        }
        
        // Show load more button if there are more
        if (hasMore) {
          loadMoreBtn.classList.remove('hidden');
        }
        
      } catch (err) {
        loading.classList.add('hidden');
        container.innerHTML = `<p class="text-red-400">Error: ${err.message}</p>`;
      }
      
      isLoading = false;
    }
    
    function loadMore() {
      currentPage++;
      loadComments(false);
    }
    
    function createCommentCard(comment) {
      const card = document.createElement('div');
      card.className = 'comment-card bg-white/5 border border-white/10 rounded-lg p-4 flex gap-4';
      card.id = `comment-${comment.id}`;
      
      const date = new Date(comment.timestamp).toLocaleDateString('de-CH', {
        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
      });
      
      card.innerHTML = `
        <a href="${comment.post.permalink}" target="_blank" class="flex-shrink-0">
          <img src="${comment.post.thumbnail}" alt="" class="w-20 h-20 object-cover rounded" loading="lazy">
        </a>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2 mb-2">
            <div>
              <span class="font-medium">@${comment.username}</span>
              <span class="text-neutral-500 text-sm ml-2">${date}</span>
            </div>
            <a href="${comment.post.permalink}" target="_blank" class="text-neutral-500 hover:text-white text-sm">↗</a>
          </div>
          <p class="text-neutral-300 mb-3">${escapeHtml(comment.text)}</p>
          <div class="flex gap-2">
            <input 
              type="text" 
              id="reply-${comment.id}" 
              placeholder="Antwort schreiben..."
              class="flex-1 bg-white/5 border border-white/10 rounded px-3 py-2 text-sm focus:outline-none focus:border-white/30"
              onkeydown="if(event.key==='Enter') sendReply('${comment.id}')"
            >
            <button 
              onclick="sendReply('${comment.id}')"
              class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded text-sm transition-colors"
            >
              Senden
            </button>
            <button 
              onclick="markDone('${comment.id}')"
              class="px-3 py-2 text-neutral-500 hover:text-green-400 transition-colors"
              title="Als erledigt markieren (ohne Antwort)"
            >
              ✓
            </button>
          </div>
        </div>
      `;
      
      return card;
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    async function sendReply(commentId) {
      const input = document.getElementById(`reply-${commentId}`);
      const message = input.value.trim();
      
      if (!message) return;
      
      input.disabled = true;
      
      try {
        const res = await fetch('/api/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comment_id: commentId, message })
        });
        
        const data = await res.json();
        
        if (data.success) {
          markDone(commentId);
          totalComments--;
          document.getElementById('count').textContent = `${totalComments} unbeantwortet`;
        } else {
          alert('Fehler: ' + (data.error?.message || JSON.stringify(data.error) || 'Unbekannt'));
          input.disabled = false;
        }
      } catch (err) {
        alert('Fehler: ' + err.message);
        input.disabled = false;
      }
    }
    
    function markDone(commentId) {
      const card = document.getElementById(`comment-${commentId}`);
      if (card) {
        card.classList.add('replied');
        setTimeout(() => {
          card.classList.add('hidden');
          totalComments--;
          document.getElementById('count').textContent = `${totalComments} unbeantwortet`;
        }, 300);
      }
    }
    
    // Add spin animation
    const style = document.createElement('style');
    style.textContent = '@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
    document.head.appendChild(style);
    
    // Load on start
    loadComments();
  </script>
</body>
</html>
