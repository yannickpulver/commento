<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .comment-card { transition: all 0.3s ease; }
    .comment-card.replied { opacity: 0.5; transform: scale(0.98); }
    .comment-card.hidden { display: none; }
  </style>
</head>
<body class="bg-neutral-950 text-white min-h-screen">
  
  <header class="border-b border-white/10 px-6 py-4 flex items-center justify-between sticky top-0 bg-neutral-950/90 backdrop-blur-sm z-10">
    <div class="flex items-center gap-4">
      <h1 class="text-xl font-medium">📸 Commento</h1>
      <span id="count" class="text-sm text-neutral-500"></span>
    </div>
    <div class="flex items-center gap-4">
      <button onclick="refresh()" class="text-sm text-neutral-400 hover:text-white">🔄 Refresh</button>
      <a href="/logout" class="text-sm text-neutral-400 hover:text-white">Logout</a>
    </div>
  </header>
  
  <main class="max-w-4xl mx-auto p-6">
    <div id="loading" class="text-center py-8 text-neutral-500">
      Lade Posts...
    </div>
    
    <div id="empty" class="text-center py-12 text-neutral-400 hidden">
      ✅ Keine unbeantworteten Kommentare!
    </div>
    
    <div id="comments" class="space-y-4"></div>
    
    <div id="load-more" class="text-center py-8 hidden">
      <button onclick="loadMorePosts()" id="load-more-btn" class="px-6 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm transition-colors">
        Ältere Posts laden...
      </button>
    </div>
  </main>

  <script>
    let nextCursor = null;
    let totalCount = 0;
    let isLoading = false;
    
    async function loadPosts(cursor = null) {
      if (isLoading) return;
      isLoading = true;
      
      const loading = document.getElementById('loading');
      const container = document.getElementById('comments');
      const loadMoreDiv = document.getElementById('load-more');
      
      if (!cursor) {
        loading.classList.remove('hidden');
        loading.textContent = 'Lade Posts...';
      } else {
        document.getElementById('load-more-btn').textContent = 'Laden...';
      }
      
      try {
        const url = cursor ? `/api/media?cursor=${cursor}` : '/api/media';
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.error) {
          loading.textContent = `Error: ${data.error}`;
          isLoading = false;
          return;
        }
        
        loading.classList.add('hidden');
        nextCursor = data.nextCursor;
        
        // Load comments for each post
        let foundAny = false;
        for (const post of data.posts) {
          const comments = await loadCommentsForPost(post);
          if (comments.length > 0) {
            foundAny = true;
            for (const comment of comments) {
              totalCount++;
              const card = createCommentCard(comment, post);
              container.appendChild(card);
            }
            updateCount();
          }
        }
        
        // Show load more if there are more posts
        if (nextCursor) {
          loadMoreDiv.classList.remove('hidden');
          document.getElementById('load-more-btn').textContent = 'Ältere Posts laden...';
        } else {
          loadMoreDiv.classList.add('hidden');
        }
        
        // Show empty if nothing found and no more to load
        if (totalCount === 0 && !nextCursor) {
          document.getElementById('empty').classList.remove('hidden');
        }
        
      } catch (err) {
        loading.textContent = `Error: ${err.message}`;
      }
      
      isLoading = false;
    }
    
    async function loadCommentsForPost(post) {
      try {
        const res = await fetch(`/api/comments/${post.id}`);
        const data = await res.json();
        return data.comments || [];
      } catch (err) {
        console.error('Failed to load comments for post', post.id, err);
        return [];
      }
    }
    
    function loadMorePosts() {
      if (nextCursor) {
        loadPosts(nextCursor);
      }
    }
    
    function refresh() {
      document.getElementById('comments').innerHTML = '';
      document.getElementById('empty').classList.add('hidden');
      totalCount = 0;
      nextCursor = null;
      updateCount();
      loadPosts();
    }
    
    function updateCount() {
      const countEl = document.getElementById('count');
      countEl.textContent = totalCount > 0 ? `${totalCount} unbeantwortet` : '';
    }
    
    function createCommentCard(comment, post) {
      const card = document.createElement('div');
      card.className = 'comment-card bg-white/5 border border-white/10 rounded-lg p-4 flex gap-4';
      card.id = `comment-${comment.id}`;
      
      const date = new Date(comment.timestamp).toLocaleDateString('de-CH', {
        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
      });
      
      const thumbnail = post.thumbnail_url || post.media_url;
      
      card.innerHTML = `
        <a href="${post.permalink}" target="_blank" class="flex-shrink-0">
          <img src="${thumbnail}" alt="" class="w-20 h-20 object-cover rounded" loading="lazy">
        </a>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2 mb-2">
            <div>
              <span class="font-medium">@${comment.username}</span>
              <span class="text-neutral-500 text-sm ml-2">${date}</span>
            </div>
            <a href="${post.permalink}" target="_blank" class="text-neutral-500 hover:text-white text-sm">↗</a>
          </div>
          <p class="text-neutral-300 mb-3">${escapeHtml(comment.text)}</p>
          <div class="flex gap-2">
            <input 
              type="text" 
              id="reply-${comment.id}" 
              placeholder="Antwort schreiben..."
              class="flex-1 bg-white/5 border border-white/10 rounded px-3 py-2 text-sm focus:outline-none focus:border-white/30"
              onkeydown="if(event.key==='Enter') sendReply('${comment.id}')"
            >
            <button 
              onclick="sendReply('${comment.id}')"
              class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded text-sm transition-colors"
            >
              Senden
            </button>
            <button 
              onclick="markDone('${comment.id}')"
              class="px-3 py-2 text-neutral-500 hover:text-green-400 transition-colors"
              title="Als erledigt markieren"
            >
              ✓
            </button>
          </div>
        </div>
      `;
      
      return card;
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    async function sendReply(commentId) {
      const input = document.getElementById(`reply-${commentId}`);
      const message = input.value.trim();
      
      if (!message) return;
      
      input.disabled = true;
      
      try {
        const res = await fetch('/api/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comment_id: commentId, message })
        });
        
        const data = await res.json();
        
        if (data.success) {
          markDone(commentId);
        } else {
          alert('Fehler: ' + (data.error?.message || JSON.stringify(data.error) || 'Unbekannt'));
          input.disabled = false;
        }
      } catch (err) {
        alert('Fehler: ' + err.message);
        input.disabled = false;
      }
    }
    
    function markDone(commentId) {
      const card = document.getElementById(`comment-${commentId}`);
      if (card) {
        card.classList.add('replied');
        setTimeout(() => {
          card.classList.add('hidden');
          totalCount--;
          updateCount();
          
          // Check if all done
          if (totalCount === 0 && !nextCursor) {
            document.getElementById('empty').classList.remove('hidden');
          }
        }, 300);
      }
    }
    
    // Start loading
    loadPosts();
  </script>
</body>
</html>
