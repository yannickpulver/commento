<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commento – Picker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .btn { @apply inline-flex h-9 items-center justify-center gap-2 rounded-md px-3 text-sm font-medium transition-colors disabled:pointer-events-none disabled:opacity-50; }
      .btn-primary { @apply btn bg-zinc-900 text-white shadow-sm hover:bg-zinc-800; }
      .btn-outline { @apply btn border border-zinc-200 bg-white shadow-sm hover:bg-zinc-100; }
      .btn-icon { @apply btn w-9 px-0 text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900; }
      .input { @apply h-9 w-full min-w-0 rounded-md border border-zinc-200 bg-white px-3 text-sm shadow-sm placeholder:text-zinc-400 focus-visible:border-zinc-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-900/10; }
      .card { @apply rounded-xl border border-zinc-200 bg-white shadow-sm; }
      .tab { @apply rounded-md px-3 py-1 font-medium text-zinc-500 transition-colors hover:text-zinc-900; }
      .tab-active { @apply bg-white text-zinc-900 shadow-sm; }
    }
  </style>
  <style>
    .winner { animation: pop 0.4s ease; box-shadow: 0 0 0 2px #18181b; }
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-10 border-b border-zinc-200 bg-white/80 backdrop-blur">
    <div class="mx-auto flex h-14 max-w-4xl items-center gap-2 px-4">
      <a href="/" onclick="localStorage.setItem('commento_view','inbox')" class="flex items-center gap-2 font-semibold tracking-tight">
        <span class="grid h-7 w-7 place-items-center rounded-md bg-zinc-900 text-sm text-white">💬</span>
        <span class="hidden sm:inline">Commento</span>
      </a>
      <span id="status" class="text-xs text-zinc-500 empty:hidden"></span>
      <nav class="ml-auto inline-flex items-center rounded-lg bg-zinc-100 p-1 text-sm">
        <a href="/" onclick="localStorage.setItem('commento_view','inbox')" class="tab">Inbox</a>
        <a href="/picker.html" onclick="localStorage.setItem('commento_view','picker')" class="tab tab-active">Picker</a>
      </nav>
      <a href="/logout" class="btn-icon" title="Logout">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-4xl p-4 sm:p-6">

    <!-- Section A: Post Grid -->
    <section id="grid-view">
      <h2 class="mb-3 text-sm text-zinc-500">Pick a post to analyze its comments</h2>
      <div id="grid-loading" class="py-12 text-center text-sm text-zinc-500">Loading posts...</div>
      <div id="grid" class="grid grid-cols-2 gap-2 sm:grid-cols-3 sm:gap-3"></div>
      <div id="grid-load-more" class="hidden py-6 text-center">
        <button onclick="loadMorePosts()" id="grid-load-more-btn" class="btn-outline">
          Load older posts...
        </button>
      </div>
    </section>

    <!-- Section B: Post Detail -->
    <section id="detail-view" class="hidden">
      <button onclick="showGrid()" class="btn -ml-3 mb-3 text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Back to posts
      </button>

      <div class="card mb-4 flex gap-3 p-4 sm:gap-4">
        <a id="detail-link" href="#" target="_blank" class="flex-shrink-0">
          <img id="detail-thumb" src="" alt="" class="h-20 w-20 rounded-md border border-zinc-200 object-cover sm:h-24 sm:w-24">
        </a>
        <div class="min-w-0 flex-1">
          <p id="detail-caption" class="mb-1 line-clamp-4 text-sm text-zinc-700"></p>
          <p id="detail-meta" class="text-xs text-zinc-400"></p>
        </div>
      </div>

      <div class="mb-3">
        <input
          id="filter-input"
          type="text"
          placeholder="Filter by word (e.g. yes)"
          oninput="renderList()"
          class="input"
        >
      </div>

      <div class="mb-3 flex items-center justify-between text-xs text-zinc-500">
        <span id="counts"></span>
        <button id="random-btn" onclick="pickRandom()" class="btn-outline hidden h-8" title="Pick random user">🎲 Random</button>
      </div>

      <div id="list-loading" class="py-12 text-center text-sm text-zinc-500">Loading comments...</div>
      <div id="list" class="space-y-2"></div>
      <div id="list-empty" class="hidden py-12 text-center text-sm text-zinc-500">No matches.</div>
    </section>

    <footer class="py-8 text-center text-xs text-zinc-400">
      by <a href="https://yannickpulver.dev" target="_blank" class="transition-colors hover:text-zinc-600">yannickpulver</a>
    </footer>
  </main>

  <script>
    // State
    let nextCursor = null;
    let isLoadingPosts = false;
    let allComments = [];          // all comments for selected post

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // ---------- GRID VIEW ----------
    async function loadPosts(cursor = null) {
      if (isLoadingPosts) return;
      isLoadingPosts = true;

      try {
        const url = cursor ? `/api/media?cursor=${cursor}` : '/api/media';
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          document.getElementById('grid-loading').textContent = 'Error: ' + JSON.stringify(data.error);
          isLoadingPosts = false;
          return;
        }

        nextCursor = data.nextCursor;
        document.getElementById('grid-loading').classList.add('hidden');

        const grid = document.getElementById('grid');
        for (const post of data.posts) {
          grid.appendChild(createGridTile(post));
        }

        const loadMore = document.getElementById('grid-load-more');
        if (nextCursor) {
          loadMore.classList.remove('hidden');
          document.getElementById('grid-load-more-btn').textContent = 'Load older posts...';
        } else {
          loadMore.classList.add('hidden');
        }
      } catch (err) {
        document.getElementById('grid-loading').textContent = 'Error: ' + err.message;
      }

      isLoadingPosts = false;
    }

    function createGridTile(post) {
      const tile = document.createElement('button');
      tile.className = 'group relative aspect-square overflow-hidden rounded-lg border border-zinc-200 bg-zinc-100 shadow-sm transition hover:ring-2 hover:ring-zinc-900';
      tile.onclick = () => selectPost(post);
      const thumb = post.thumbnail_url || post.media_url;
      tile.innerHTML = `
        <img src="${thumb}" alt="" class="w-full h-full object-cover" loading="lazy">
        <div class="absolute inset-x-0 bottom-0 p-2 bg-gradient-to-t from-black/80 to-transparent text-left">
          <p class="text-[10px] sm:text-xs text-white/90 line-clamp-2">${escapeHtml((post.caption || '').slice(0, 80))}</p>
        </div>
      `;
      return tile;
    }

    function loadMorePosts() {
      if (nextCursor) loadPosts(nextCursor);
    }

    // ---------- DETAIL VIEW ----------
    async function selectPost(post) {
      document.getElementById('grid-view').classList.add('hidden');
      document.getElementById('detail-view').classList.remove('hidden');
      window.scrollTo(0, 0);

      const thumb = post.thumbnail_url || post.media_url;
      document.getElementById('detail-thumb').src = thumb;
      document.getElementById('detail-link').href = post.permalink;
      document.getElementById('detail-caption').textContent = post.caption || '(no caption)';
      document.getElementById('detail-meta').textContent = new Date(post.timestamp).toLocaleString();

      document.getElementById('filter-input').value = '';
      document.getElementById('list').innerHTML = '';
      document.getElementById('list-empty').classList.add('hidden');
      document.getElementById('list-loading').classList.remove('hidden');
      document.getElementById('random-btn').classList.add('hidden');
      document.getElementById('counts').textContent = '';

      try {
        const res = await fetch(`/api/comments/${post.id}?all=1`);
        const data = await res.json();
        allComments = data.comments || [];
        document.getElementById('list-loading').classList.add('hidden');
        renderList();
      } catch (err) {
        document.getElementById('list-loading').textContent = 'Error: ' + err.message;
      }
    }

    function showGrid() {
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('grid-view').classList.remove('hidden');
      allComments = [];
    }

    // Build deduplicated user list from currently-filtered comments.
    // Per user: keep their FIRST matching comment (chronologically earliest).
    function buildFilteredUsers() {
      const filter = document.getElementById('filter-input').value.trim().toLowerCase();
      const matches = filter
        ? allComments.filter(c => (c.text || '').toLowerCase().includes(filter))
        : allComments;

      const byUser = new Map();
      // sort ascending by timestamp so first occurrence wins
      const sorted = [...matches].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
      for (const c of sorted) {
        if (!byUser.has(c.username)) byUser.set(c.username, c);
      }
      return { users: [...byUser.values()], totalMatches: matches.length };
    }

    function renderList() {
      const { users, totalMatches } = buildFilteredUsers();
      const list = document.getElementById('list');
      const empty = document.getElementById('list-empty');
      const randomBtn = document.getElementById('random-btn');

      document.getElementById('counts').textContent =
        `${totalMatches} match${totalMatches === 1 ? '' : 'es'} • ${users.length} unique user${users.length === 1 ? '' : 's'} (${allComments.length} total)`;

      list.innerHTML = '';
      if (users.length === 0) {
        empty.classList.remove('hidden');
        randomBtn.classList.add('hidden');
        return;
      }
      empty.classList.add('hidden');
      randomBtn.classList.toggle('hidden', users.length < 2);

      for (const c of users) {
        list.appendChild(createUserRow(c));
      }
    }

    function createUserRow(comment) {
      const row = document.createElement('div');
      row.className = 'card flex gap-3 p-3';
      row.dataset.username = comment.username;
      row.innerHTML = `
        <img src="/api/avatar/${encodeURIComponent(comment.username)}" alt="" class="w-10 h-10 rounded-full flex-shrink-0">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <a href="https://instagram.com/${encodeURIComponent(comment.username)}" target="_blank" class="text-sm font-medium hover:underline">@${escapeHtml(comment.username)}</a>
            <span class="ml-auto text-xs text-zinc-400">${new Date(comment.timestamp).toLocaleDateString()}</span>
          </div>
          <p class="mt-1 break-words text-sm text-zinc-700">${escapeHtml(comment.text)}</p>
        </div>
      `;
      return row;
    }

    function pickRandom() {
      const { users } = buildFilteredUsers();
      if (users.length === 0) return;
      const winner = users[Math.floor(Math.random() * users.length)];
      document.querySelectorAll('#list .winner').forEach(el => el.classList.remove('winner'));
      const row = document.querySelector(`[data-username="${CSS.escape(winner.username)}"]`);
      if (row) {
        row.classList.add('winner');
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    // Boot
    loadPosts();
  </script>
</body>
</html>
